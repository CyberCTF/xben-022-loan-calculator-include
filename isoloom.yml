# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-022-24 Loan Calculator - Include (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask loan calculator (Apache mod_wsgi) with a MySQL 5.7 database.
# The benchmark folder benchmarks/XBEN-022-24 is vendored unchanged in build/web/app/;
# the machine builds from an overlay of its own Dockerfile that bakes in a development flag,
# swapped for the player's flag at start by its ctf-entrypoint.sh.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-022-loan-calculator-include

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.65.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    depends_on: [db]
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

  db:
    networks: { lab: 20 }
    services: [{ port: 3306, name: mysql }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/db

checks:
  - name: the web service answers
    http: http://web/
    expect: any
    wait: 180
  - name: the benchmark's page /login is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-022-24 (Loan Calculator - Include) answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Including Jinja templates dynamically is not a rare practice. Which template gets included?
